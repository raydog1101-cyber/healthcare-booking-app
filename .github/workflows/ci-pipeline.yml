name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature-login-page
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project files
        run: |
          test -f index.html
          test -f style.css
          test -f README.md

      - name: Build check
        run: echo "Static HTML project - no build required"